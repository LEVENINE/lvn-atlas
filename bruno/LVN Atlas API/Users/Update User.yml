info:
  name: Update User
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}api/v1/users/{{userId}}"
  body:
    type: json
    data: |-
      {
        "email": "john@example.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return the updated user", function () {
          const body = res.getBody();

          expect(body.id).to.equal(bru.getVar("userId"));
          expect(body.email).to.equal("john@example.com");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
