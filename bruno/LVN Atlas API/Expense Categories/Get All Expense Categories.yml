info:
  name: Get All Expense Categories
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}api/v1/expense-categories"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return the seeded expense categories", function () {
          const body = res.getBody();

          expect(body).to.be.an("array");
          expect(body.length).to.be.greaterThan(0);

          const rent = body.find((category) => category.name === "Rent");
          const groceries = body.find((category) => category.name === "Groceries");

          expect(rent).to.not.be.undefined;
          expect(groceries).to.not.be.undefined;

          bru.setVar("rentCategoryId", rent.id);
          bru.setVar("groceriesCategoryId", groceries.id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
