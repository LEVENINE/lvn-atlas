info:
  name: Get All Blueprints
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}api/v1/blueprints"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should only return the current user's blueprints", function () {
          const body = res.getBody();

          expect(body).to.be.an("array");
          expect(body.some(function (blueprint) {
            return blueprint.id === bru.getVar("blueprintId");
          })).to.equal(true);
        });

        test("should include an atlas score for every blueprint", function () {
          const body = res.getBody();

          expect(
            body.every(function (blueprint) {
              return (
                blueprint.atlasScore &&
                typeof blueprint.atlasScore.score === "number" &&
                blueprint.summary &&
                typeof blueprint.summary.totalExpenses === "string"
              );
            }),
          ).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
