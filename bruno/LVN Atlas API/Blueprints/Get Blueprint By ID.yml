info:
  name: Get Blueprint By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}api/v1/blueprints/{{blueprintId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return the requested blueprint", function () {
          expect(res.getBody().id).to.equal(bru.getVar("blueprintId"));
        });

        test("should include a derived atlas score", function () {
          const score = res.getBody().atlasScore;

          expect(score.score).to.be.a("number");
          expect(score.score).to.be.within(0, 100);
          expect(score.band).to.be.a("string");
          expect(score.factors).to.be.an("object");
          expect(score.factors.householdSize).to.be.a("number");
        });

        test("should include comparison-ready budget figures", function () {
          const summary = res.getBody().summary;

          expect(summary.expectedMonthlyIncome).to.be.a("string");
          expect(summary.totalExpenses).to.be.a("string");
          expect(summary.expectedSavings).to.be.a("string");
          expect(summary.disposableIncome).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
