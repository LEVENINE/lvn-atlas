info:
  name: Get Deleted Blueprint
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}api/v1/blueprints/{{blueprintId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 404 status", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("should report the deleted blueprint as missing", function () {
          expect(res.getBody().error.code).to.equal("BLUEPRINT_NOT_FOUND");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
