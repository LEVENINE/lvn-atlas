info:
  name: Update Blueprint
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}api/v1/blueprints/{{blueprintId}}"
  body:
    type: json
    data: |-
      {
        "expectedMonthlyIncome": 300000,
        "relocatingHouseholdSize": 2
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return the updated blueprint", function () {
          const body = res.getBody();

          expect(body.id).to.equal(bru.getVar("blueprintId"));
          expect(body.expectedMonthlyIncome).to.equal("300000.00");
          expect(body.relocatingHouseholdSize).to.equal(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
