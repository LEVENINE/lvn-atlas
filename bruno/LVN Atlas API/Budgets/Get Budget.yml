info:
  name: Get Budget
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}api/v1/blueprints/{{blueprintId}}/budget"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return the blueprint's budget", function () {
          const body = res.getBody();

          expect(body.blueprintId).to.equal(bru.getVar("blueprintId"));
          expect(body.expenseItems).to.be.an("array");

          expect(body.summary.expectedMonthlyIncome).to.equal("250000.00");
          expect(body.summary.totalExpenses).to.be.a("string");
          expect(body.summary.expectedSavings).to.be.a("string");
          expect(body.summary.disposableIncome).to.equal(
            body.summary.expectedSavings,
          );

          bru.setVar("budgetId", body.id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
