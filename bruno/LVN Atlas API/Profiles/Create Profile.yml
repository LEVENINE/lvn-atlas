info:
  name: Create Profile
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}api/v1/profiles"
  body:
    type: json
    data: |-
      {
        "userId": "{{userId}}",
        "firstName": "New",
        "lastName": "User",
        "occupation": "Software Engineer",
        "householdSize": 2,
        "numberOfDependents": 0,
        "dietaryPreference": "NON_VEGETARIAN",
        "housingPreference": "TWO_BHK",
        "transportationPreference": "PUBLIC_TRANSPORT",
        "lifestylePreference": "Quiet neighbourhood close to work"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 201 status", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("should return the created profile", function () {
          const body = res.getBody();

          expect(body.id).to.be.a("string");
          expect(body.userId).to.equal(bru.getVar("userId"));
          expect(body.firstName).to.equal("New");
          expect(body.householdSize).to.equal(2);

          bru.setVar("profileId", body.id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
