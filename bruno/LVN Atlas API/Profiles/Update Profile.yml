info:
  name: Update Profile
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}api/v1/profiles/{{profileId}}"
  body:
    type: json
    data: |-
      {
        "firstName": "Updated",
        "householdSize": 3
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return the updated profile", function () {
          const body = res.getBody();

          expect(body.id).to.equal(bru.getVar("profileId"));
          expect(body.firstName).to.equal("Updated");
          expect(body.householdSize).to.equal(3);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
