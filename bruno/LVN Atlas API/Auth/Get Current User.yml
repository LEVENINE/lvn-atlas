info:
  name: Get Current User
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}api/v1/auth/me"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 status", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return the authenticated user", function () {
          const body = res.getBody();

          expect(body.id).to.equal(bru.getVar("userId"));
          expect(body.passwordHash).to.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
