info:
  name: Get Current User Without Token
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}api/v1/auth/me"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 401 status", function () {
          expect(res.getStatus()).to.equal(401);
        });

        test("should return an UNAUTHORIZED error", function () {
          const body = res.getBody();

          expect(body.success).to.equal(false);
          expect(body.error.code).to.equal("UNAUTHORIZED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
